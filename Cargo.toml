[package]
name = "coin-tui"
version = "0.1.0"
edition = "2021"
description = "Fast, read-only cryptocurrency market dashboard for the terminal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/matheuseabra/coin-tui"
homepage = "https://github.com/matheuseabra/coin-tui"
keywords = ["crypto", "cryptocurrency", "tui", "terminal", "dashboard"]
categories = ["command-line-utilities", "finance"]
exclude = [".github/", ".opencode/", ".gitignore", "AGENTS.md"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chandelier = "0.4"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1"
url = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
unicode-width = "0.2"
quick-xml = { version = "0.37", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"

[profile.dev]
debug = 0
